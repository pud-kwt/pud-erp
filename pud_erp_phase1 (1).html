<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUD ERP | Phase 1</title><style>:root{font-family:Inter,system-ui,Arial;color:#173342;background:#f4f8fa}*{box-sizing:border-box}body{margin:0}header{background:#102c3c;color:white;padding:19px 28px;display:flex;justify-content:space-between;align-items:center}header b{font-size:23px;color:#66c7df}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 25px;background:white;border-bottom:1px solid #ddd}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;background:#14617b;color:white;padding:10px 15px}button.secondary{background:#e4eff3;color:#173342}button.danger{background:#ad4450}nav button{background:#eaf2f5;color:#173342}nav button.active{background:#102c3c;color:white}main{max-width:1250px;margin:24px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:13px}.card,.panel{background:white;border:1px solid #e0eaf0;border-radius:13px;padding:19px;margin-bottom:15px}.card small{color:#67808e}.card strong{display:block;font-size:25px;margin-top:9px}.panel h2{margin:0 0 12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf0}th{color:#6f8490;background:#f7fafb} .scroll{overflow:auto}form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#526b79}input,select{border:1px solid #cbdbe2;border-radius:7px;padding:10px;min-width:145px;background:white} .muted{color:#67808e;font-size:13px}.notice{background:#fff7e5;border:1px solid #ead6a6;padding:12px;border-radius:9px;margin-bottom:18px}.positive{color:#158269}.negative{color:#c34c57}.tag{background:#e5f4f8;padding:4px 8px;border-radius:6px}.hide{display:none}.bar{height:14px;background:#66c7df;border-radius:5px;margin:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}@media(max-width:600px){header{display:block}td,th{white-space:nowrap}}</style></head><body><header><div><b>PUD</b> &nbsp; ERP / Distribution Control</div><span>PHASE 1 · Local sandbox · KWD</span></header><nav id="nav"></nav><main><div class="notice"><b>Functional pilot, not production:</b> Data is stored only in this browser. No Supabase connection, multi-user sync, backups, or real invoice issuance. Start with test records only. The existing PUD tracker is untouched.</div><div id="view"></div></main><script>
const KEY='pud_erp_phase1_v1';const pages=['Dashboard','Retailers','Deliveries','Sell-through','Returns','Payments','SOA','Audit & Export'];let page='Dashboard';let state=load();function empty(){return {retailers:[],events:[],seq:0}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.events)&&Array.isArray(x.retailers)?x:empty()}catch{return empty()}}function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function money(n){return (Math.round((n+Number.EPSILON)*1000)/1000).toFixed(3)+' KD'}function fmt(n){return Number(n).toLocaleString()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(v){let n=Number(v);if(!Number.isFinite(n)||n<=0)throw Error('Enter a positive number');return n}function qty(v){let n=num(v);if(!Number.isInteger(n))throw Error('Quantity must be a whole number');return n}function id(){return 'PUD-'+String(++state.seq).padStart(6,'0')}function events(r){return state.events.filter(e=>e.retailer===r.id&&!e.reversed)}function calc(r){let stock=0,receivable=0,sold=0,delivered=0,paid=0,returns=0;for(const e of events(r)){if(e.type==='delivery'){stock+=e.qty;delivered+=e.qty}else if(e.type==='sale'){stock-=e.qty;sold+=e.qty;receivable+=e.mills/1000}else if(e.type==='return'){stock-=e.qty;returns+=e.qty}else if(e.type==='payment'){receivable-=e.mills/1000;paid+=e.mills/1000}}return {stock,receivable,sold,delivered,paid,returns}}function total(k){return state.retailers.reduce((n,r)=>n+calc(r)[k],0)}function card(label,value){return `<div class="card"><small>${label}</small><strong>${value}</strong></div>`}function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="muted">No records yet</td></tr>`}</tbody></table></div>`}function options(){return state.retailers.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}function input(label,name,type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`}function selector(){return `<label>Retailer<select name="retailer" required>${options()}</select></label>`}function form(kind,fields,label){return `<form onsubmit="post(event,'${kind}')">${fields}<button type="submit">${label}</button></form>`}function nav(){document.getElementById('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}function go(p){page=p;render()}function render(){nav();let v='';if(page==='Dashboard'){v=`<div class="cards">${card('Consignment stock at retailers',fmt(total('stock'))+' bars')}${card('Outstanding receivables',money(total('receivable')))}${card('Confirmed sold',fmt(total('sold'))+' bars')}${card('Cash receipts',money(total('paid')))}</div>`+panel('Retailer account health',table(['Retailer','Unit price','Stock','Confirmed sales','Outstanding'],state.retailers.map(r=>{let c=calc(r);return [esc(r.name),money(r.mills/1000),fmt(c.stock),fmt(c.sold),money(c.receivable)]})))+panel('Operational principle','Deliveries transfer custody only. Confirmed sales generate receivables. Unsold returns reduce retailer stock without changing receivables. Payments reduce receivables. Posted entries are reversed, not deleted.')}
if(page==='Retailers'){v=panel('Create retailer',form('retailer',input('Retailer name','name')+input('Price per bar (KD)','price','number','min="0.001" step="0.001"') ,'Add retailer'))+panel('Retailer accounts',table(['Name','Selling price','Stock','Receivable'],state.retailers.map(r=>[esc(r.name),money(r.mills/1000),fmt(calc(r).stock),money(calc(r).receivable)])))}
if(page==='Deliveries'){v=panel('Deliver consignment stock',form('delivery',selector()+input('Bars delivered','qty','number','min="1" step="1"')+input('Delivery reference','ref'),'Post delivery'))+history('delivery')}
if(page==='Sell-through'){v=panel('Confirm retailer sales',form('sale',selector()+input('Bars sold','qty','number','min="1" step="1"')+input('Retailer sales reference','ref'),'Post confirmed sale'))+`<p class="muted">Uses retailer unit price at posting time. Sale cannot exceed available stock. Every confirmed sale creates a receivable.</p>`+history('sale')}
if(page==='Returns'){v=panel('Return unsold consignment stock',form('return',selector()+input('Bars returned','qty','number','min="1" step="1"')+input('Return reference','ref'),'Post stock return'))+`<p class="muted">Phase 1 supports unsold stock returns only. Returns of previously invoiced sales require a credit note workflow and are not enabled here.</p>`+history('return')}
if(page==='Payments'){v=panel('Record retailer payment',form('payment',selector()+input('Payment (KD)','amount','number','min="0.001" step="0.001"')+input('Bank transaction reference','ref'),'Post payment'))+`<p class="muted">Payment cannot exceed current outstanding balance. Invoice-level allocation and unapplied advances are reserved for the production ledger.</p>`+history('payment')}
if(page==='SOA'){v=panel('Statements of Account',`<label>Choose retailer<select id="soaRetailer" onchange="soa()">${options()}</select></label><div id="soaContent" style="margin-top:14px"></div>`)}
if(page==='Audit & Export'){v=panel('Audit trail',`<p class="muted">Posted records are immutable. Reversal adds an auditable compensating status. Reversal of older stock transactions is blocked when it would make the current inventory or receivable negative.</p>`+table(['ID','Date','Type','Retailer','Qty','Amount','Reference','Status','Action'],state.events.slice().reverse().map(e=>{let r=state.retailers.find(x=>x.id===e.retailer);return [esc(e.id),esc(e.date.slice(0,19).replace('T',' ')),esc(e.type),esc(r?.name||''),e.qty||'—',e.mills?money(e.mills/1000):'—',esc(e.ref),e.reversed?'Reversed':'Posted',e.reversed?'—':`<button class="danger" onclick="reverse('${e.id}')">Reverse</button>`]})))+panel('Export / restore',`<div class="actions"><button onclick="exportJSON()">Export JSON backup</button><button class="secondary" onclick="document.getElementById('importfile').click()">Import sandbox backup</button><input id="importfile" type="file" accept="application/json" class="hide" onchange="importJSON(event)"></div><p class="muted">Import replaces this browser's Phase 1 sandbox records only. Never import your legacy production backup directly into this sandbox.</p>`)}
document.getElementById('view').innerHTML=v;if(page==='SOA')soa()}
function history(type){return panel('Posted '+type+' records',table(['ID','Date','Retailer','Bars','Value','Reference','Status'],state.events.filter(e=>e.type===type).slice().reverse().map(e=>{let r=state.retailers.find(x=>x.id===e.retailer);return [esc(e.id),esc(e.date.slice(0,10)),esc(r?.name||''),e.qty||'—',e.mills?money(e.mills/1000):'—',esc(e.ref),e.reversed?'Reversed':'Posted']})))}
function post(ev,kind){ev.preventDefault();try{let f=new FormData(ev.target),ref=String(f.get('ref')||'').trim();if(kind==='retailer'){let name=String(f.get('name')||'').trim(),mills=Math.round(num(f.get('price'))*1000);if(!name||!mills)throw Error('Retailer name and price are required');if(state.retailers.some(r=>r.name.toLowerCase()===name.toLowerCase()))throw Error('Retailer already exists');state.retailers.push({id:id(),name,mills});persist();render();return}let r=state.retailers.find(x=>x.id===f.get('retailer'));if(!r)throw Error('Choose a retailer');if(!ref)throw Error('Reference is required');if(state.events.some(e=>e.retailer===r.id&&e.type===kind&&e.ref.toLowerCase()===ref.toLowerCase()&&!e.reversed))throw Error('Duplicate active transaction reference');let c=calc(r),e={id:id(),date:new Date().toISOString(),retailer:r.id,type:kind,ref,reversed:false};if(kind==='payment'){e.mills=Math.round(num(f.get('amount'))*1000);if(e.mills>Math.round(c.receivable*1000))throw Error('Payment exceeds outstanding receivable')}else{e.qty=qty(f.get('qty'));if((kind==='sale'||kind==='return')&&e.qty>c.stock)throw Error('Insufficient retailer consignment stock');if(kind==='sale')e.mills=e.qty*r.mills}state.events.push(e);persist();render()}catch(err){alert(err.message)}}
function reverse(eid){let e=state.events.find(x=>x.id===eid);if(!e||e.reversed)return;if(!confirm('Reverse '+eid+'? This changes balances and remains in the audit history.'))return;let r=state.retailers.find(x=>x.id===e.retailer),c=calc(r);if(e.type==='delivery'&&c.stock<e.qty){alert('Cannot reverse: later sales or returns consumed this stock. Reverse dependent transactions first.');return}if(e.type==='sale'&&c.receivable+0.000001<e.mills/1000){alert('Cannot reverse: payments depend on this receivable. Reverse dependent payments first.');return}e.reversed=true;e.reversedAt=new Date().toISOString();persist();render()}
function soa(){let sel=document.getElementById('soaRetailer'),out=document.getElementById('soaContent');if(!sel||!out)return;let r=state.retailers.find(x=>x.id===sel.value);if(!r){out.innerHTML='No retailers yet';return}let evs=events(r).filter(e=>e.type==='sale'||e.type==='payment');let bal=0,rows=evs.map(e=>{let debit=e.type==='sale'?e.mills/1000:0,credit=e.type==='payment'?e.mills/1000:0;bal+=debit-credit;return [esc(e.date.slice(0,10)),esc(e.id),esc(e.type),esc(e.ref),debit?money(debit):'—',credit?money(credit):'—',money(bal)]});out.innerHTML=`<p><b>${esc(r.name)}</b> · Opening: 0.000 KD · Debits: ${money(evs.filter(e=>e.type==='sale').reduce((s,e)=>s+e.mills,0)/1000)} · Credits: ${money(evs.filter(e=>e.type==='payment').reduce((s,e)=>s+e.mills,0)/1000)}</p>`+table(['Date','ID','Type','Reference','Debit','Credit','Running balance'],rows)+`<h2>Closing balance: ${money(bal)}</h2><p class="muted">Full-history sandbox SOA; dated opening balances and approved reconciliation journals are not yet supported.</p>`}
function exportJSON(){let blob=new Blob([JSON.stringify({format:'pud-phase1-sandbox',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pud-phase1-sandbox-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importJSON(ev){try{let x=JSON.parse(await ev.target.files[0].text());if(x.format!=='pud-phase1-sandbox'||x.version!==1||!Array.isArray(x.data?.retailers)||!Array.isArray(x.data?.events))throw Error('Not a Phase 1 sandbox backup');if(!confirm('Replace all current sandbox records?'))return;state=x.data;persist();render()}catch(e){alert(e.message)}}render();
</script></body></html>
